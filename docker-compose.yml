services:
  mongodb:
    image: mongo:7-jammy
    container_name: ct_mongodb
    restart: 'no'
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: compra-transparente
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:16-alpine
    container_name: ct_postgresql
    restart: 'no'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ct_fondos
      POSTGRES_USER: ct_fondos
      POSTGRES_PASSWORD: password
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ct_fondos -d ct_fondos']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ct_redis
    restart: 'no'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
